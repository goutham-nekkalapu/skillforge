<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- REPLACE: page title = note title -->
<title>Consistent Hashing - interactive</title>
<style>
  /* Self-contained: no external scripts, fonts or CDNs, so it works offline
     inside Obsidian HTML plugins (sandboxed iframes) and any browser. */
  :root {
    --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #d9d6cf;
    --accent: #2f6fde; --accent-soft: #e3ecfc; --good: #1f8a5b; --warn: #c2410c;
    --node: #f3f1ec; --node-ink: #1d1d1b; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2023; --ink: #ecebe8; --muted: #a09f9a; --line: #3a3b3f;
      --accent: #7aa7ff; --accent-soft: #23314d; --good: #4cc38a; --warn: #f0894f;
      --node: #2a2b2f; --node-ink: #ecebe8; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 28px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: .92rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .stage { padding: 8px; }
  svg { width: 100%; height: auto; display: block; }

  /* Scene elements: anything with class "el" is hidden until a step shows it. */
  .el { opacity: 0; transition: opacity .35s ease; }
  .el.on { opacity: 1; }
  .always { opacity: 1; }
  .el.dim, .always.dim { opacity: .28; }
  .box { fill: var(--node); stroke: var(--line); stroke-width: 1.5; transition: fill .3s, stroke .3s; }
  .hl .box, .box.hl { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
  .lbl { fill: var(--node-ink); font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
  .small { fill: var(--muted); font-size: 12px; text-anchor: middle; }
  .edge { stroke: var(--muted); stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .edge.hl { stroke: var(--accent); stroke-width: 3; }
  .edge.flow { stroke-dasharray: 7 6; animation: dash 0.9s linear infinite; }
  .edge.good { stroke: var(--good); } .edge.bad { stroke: var(--warn); }
  @keyframes dash { to { stroke-dashoffset: -26; } }
  @media (prefers-reduced-motion: reduce) { .edge.flow { animation: none; } .el { transition: none; } }

  .caption { padding: 14px 18px 16px; border-top: 1px solid var(--line); min-height: 92px; }
  .caption h2 { font-size: 1rem; margin: 0 0 4px; }
  .caption p { margin: 0; color: var(--ink); }
  .state { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 4px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--ink); border: 1px solid var(--line); }
  .controls { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  button { font: inherit; font-size: .9rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  .dots { display: flex; gap: 6px; margin-left: auto; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); border: 0; padding: 0; }
  .dot.cur { background: var(--accent); }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 10px; }

  .ring { fill: none; stroke: var(--line); stroke-width: 10; }
  .srv circle { stroke: var(--panel); stroke-width: 3; }
  .srv text { font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: middle; }
  .key { stroke: var(--panel); stroke-width: 1.5; transition: fill .4s, r .3s; fill: var(--muted); }
  .key.moved { stroke: var(--warn); stroke-width: 3; }
  .vn { opacity: 0; transition: opacity .35s; }
  .vn.on { opacity: .9; }
  .walk { stroke: var(--accent); stroke-width: 4; fill: none; stroke-dasharray: 7 6; animation: dash .9s linear infinite; }
  .cA{fill:#e2725b}.cB{fill:#3b82c4}.cC{fill:#2f9e6e}.cD{fill:#b07cc6}.cE{fill:#d4a017}
</style>
</head>
<body>
<div class="wrap">
  <!-- REPLACE: heading + one-line description -->
  <h1>Consistent hashing: adding a server to the ring</h1>
  <p class="sub">Watch keys pick their server, then see how few keys move when server E joins.</p>

  <div class="card">
    <div class="stage">
      <!-- REPLACE: the scene. Draw every element once. Give each an id.
           class="el"     hidden until a step lists it in `show`
           class="always" always visible (can still be dimmed/highlighted)
           Wrap a box + label in <g id="..."> so highlighting the group works. -->
      <svg id="scene" viewBox="0 0 860 330" role="img" aria-label="Hash ring with servers A to E and ten keys">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color: var(--muted)"></path>
          </marker>
        </defs>
      </svg>
    </div>
    <div class="caption" aria-live="polite">
      <h2 id="cap-title"></h2>
      <p id="cap-text"></p>
      <div class="state" id="state"></div>
    </div>
    <div class="controls">
      <button id="prev" aria-label="Previous step">◀ Prev</button>
      <button id="play" aria-label="Play or pause">▶ Play</button>
      <button id="next" aria-label="Next step">Next ▶</button>
      <button id="reset" aria-label="Restart">↺</button>
      <div class="dots" id="dots"></div>
    </div>
  </div>
  <p class="hint">Keys: ← → to step, space to play/pause.</p>
</div>

<script>

/* Scene builder: draws the ring, servers, keys and virtual nodes with ids. */
(() => {
  const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("scene");
  const cx = 430, cy = 165, r = 120;
  const pt = (a, rr = r) => [cx + rr * Math.sin(a * Math.PI / 180), cy - rr * Math.cos(a * Math.PI / 180)];
  const mk = (tag, attrs, parent = svg) => { const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; };
  mk("circle", { id: "ring", class: "always ring", cx, cy, r });
  const t0 = mk("text", { id: "t-zero", class: "el small", x: cx, y: cy - r - 16 }); t0.textContent = "0 = 2³²";
  const t1 = mk("text", { id: "t-dir", class: "el small", x: cx + 175, y: cy - 95 }); t1.textContent = "clockwise ↻";
  window.SERVERS = { A: 20, B: 110, C: 200, D: 290, E: 150 };
  window.KEYS = [50, 80, 125, 140, 170, 185, 230, 260, 320, 350];
  for (const [name, a] of Object.entries(SERVERS)) {
    const g = mk("g", { id: "s" + name, class: "el srv" });
    const [x, y] = pt(a);
    mk("circle", { cx: x, cy: y, r: 15, class: "c" + name }, g);
    const lbl = mk("text", { x: x, y: y }, g); lbl.textContent = name;
  }
  KEYS.forEach((a, i) => { const [x, y] = pt(a, r); mk("circle", { id: "k" + i, class: "el key", cx: x, cy: y, r: 6 }); });
  // virtual nodes: 3 extra points per server (in reality 100-200)
  const vn = { A: [95, 215, 300], B: [10, 175, 255], C: [65, 135, 335], D: [40, 160, 240] };
  for (const [name, list] of Object.entries(vn)) list.forEach((a, j) => {
    const [x, y] = pt(a, r + 22); mk("circle", { id: `v${name}${j}`, class: "vn c" + name, cx: x, cy: y, r: 6 });
  });
  // the clockwise walk for key k2 (125°) to C (200°)
  const [x1, y1] = pt(127, r - 18), [x2, y2] = pt(198, r - 18);
  mk("path", { id: "walk", class: "el walk", d: `M${x1},${y1} A${r - 18},${r - 18} 0 0 1 ${x2},${y2}` });
})();

function owner(a, servers) {           // first server clockwise from angle a
  const names = Object.keys(servers).sort((p, q) => servers[p] - servers[q]);
  for (const n of names) if (servers[n] >= a) return n;
  return names[0];
}
function colorKeys(api, servers, markMoved) {
  const before = { A: 20, B: 110, C: 200, D: 290 };
  KEYS.forEach((a, i) => {
    const el = api.$("k" + i), o = owner(a, servers);
    el.setAttribute("class", "el on key c" + o + (markMoved && owner(a, before) !== o ? " moved" : ""));
  });
}
function grayKeys(api) { KEYS.forEach((a, i) => api.$("k" + i).setAttribute("class", "el on key")); }
function vnodes(api, on) { document.querySelectorAll(".vn").forEach(n => n.classList.toggle("on", on)); }
const FOUR = { A: 20, B: 110, C: 200, D: 290 }, FIVE = { ...FOUR, E: 150 };
const K = [...Array(10).keys()].map(i => "k" + i);

const STEPS = [
  { title: "1 · The hash ring",
    text: "Take the hash function's whole output range, 0 to 2³², and join the ends. Every server and every key gets a position on this circle.",
    show: ["t-zero", "t-dir"], highlight: ["ring"], onEnter: (api) => vnodes(api, false) },
  { title: "2 · Hash the servers onto the ring",
    text: "Each server's name is hashed to a point. Here four servers A, B, C and D land at different places.",
    show: ["t-zero", "t-dir", "sA", "sB", "sC", "sD"], onEnter: (api) => vnodes(api, false) },
  { title: "3 · Hash the keys too",
    text: "Each key is hashed with the same function, so it also lands somewhere on the ring.",
    show: ["sA", "sB", "sC", "sD", ...K], onEnter: (api) => { vnodes(api, false); grayKeys(api); } },
  { title: "4 · A key belongs to the next server clockwise",
    text: "To find a key's server, start at the key and walk clockwise until you meet a server. This key walks round to C.",
    show: ["sA", "sB", "sC", "sD", ...K, "walk"], highlight: ["sC"],
    onEnter: (api) => { vnodes(api, false); grayKeys(api); api.$("k2").setAttribute("class", "el on key cC"); } },
  { title: "5 · Every key gets an owner",
    text: "Applying the rule to all keys colours each by its server. Each server owns the arc from the previous server up to itself.",
    show: ["sA", "sB", "sC", "sD", ...K], state: { servers: 4, keys: 10 },
    onEnter: (api) => { vnodes(api, false); colorKeys(api, FOUR, false); } },
  { title: "6 · Server E joins between B and C",
    text: "E hashes to a point between B and C. Keys elsewhere on the ring don't care: their next server clockwise is unchanged.",
    show: ["sA", "sB", "sC", "sD", "sE", ...K], highlight: ["sE"],
    onEnter: (api) => { vnodes(api, false); colorKeys(api, FOUR, false); } },
  { title: "7 · Only keys between B and E move",
    text: "Keys between B and E now meet E before C, so they move from C to E (outlined). Every other key stays put.",
    show: ["sA", "sB", "sC", "sD", "sE", ...K], highlight: ["sE"], state: { moved: "2 of 10", "≈ 1/N": "1/5 = 20%" },
    onEnter: (api) => { vnodes(api, false); colorKeys(api, FIVE, true); } },
  { title: "8 · Compare with hash mod N",
    text: "With mod N, going from 4 to 5 servers would move about 80% of keys. The ring moved 20%: only the new server's share.",
    show: ["sA", "sB", "sC", "sD", "sE", ...K], state: { "mod N": "~80% move", ring: "~20% move" },
    onEnter: (api) => { vnodes(api, false); colorKeys(api, FIVE, true); } },
  { title: "9 · Virtual nodes even out the load",
    text: "With few servers the arcs are uneven. Hashing each server many times (here 3 extra points; in practice 100–200) gives many small arcs, so load evens out and a leaving server's keys spread across many neighbours.",
    show: ["sA", "sB", "sC", "sD"], state: { "virtual nodes": "per server ×100–200" },
    onEnter: (api) => vnodes(api, true) },
];

/* ---- engine (normally no need to edit) ---- */
(() => {
  const $ = (id) => document.getElementById(id);
  const all = (sel) => Array.from(document.querySelectorAll(sel));
  const els = all("svg .el"), alwaysEls = all("svg .always");
  const capT = $("cap-title"), capX = $("cap-text"), stateBox = $("state"), dots = $("dots");
  let i = 0, timer = null;
  const api = { $, step: () => i };

  STEPS.forEach((_, k) => {
    const b = document.createElement("button");
    b.className = "dot"; b.setAttribute("aria-label", "Go to step " + (k + 1));
    b.onclick = () => { stop(); go(k); };
    dots.appendChild(b);
  });

  function setCls(ids, cls) {
    all("svg ." + cls).forEach((n) => n.classList.remove(cls));
    (ids || []).forEach((id) => { const n = $(id); if (n) n.classList.add(cls); else console.warn("missing id", id); });
  }

  function go(k) {
    i = Math.max(0, Math.min(STEPS.length - 1, k));
    const s = STEPS[i];
    const show = new Set(s.show || []);
    els.forEach((n) => n.classList.toggle("on", show.has(n.id)));
    setCls(s.highlight, "hl"); setCls(s.flow, "flow"); setCls(s.dim, "dim");
    alwaysEls.forEach((n) => n.classList.toggle("dim", (s.dim || []).includes(n.id)));
    capT.textContent = s.title || ""; capX.textContent = s.text || "";
    stateBox.innerHTML = "";
    Object.entries(s.state || {}).forEach(([k2, v]) => {
      const c = document.createElement("span"); c.className = "chip"; c.textContent = k2 + ": " + v; stateBox.appendChild(c);
    });
    all(".dot").forEach((d, k2) => d.classList.toggle("cur", k2 === i));
    $("prev").disabled = i === 0; $("next").disabled = i === STEPS.length - 1;
    if (typeof s.onEnter === "function") { try { s.onEnter(api); } catch (e) { console.error(e); } }
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; $("play").textContent = "▶ Play"; } }
  function play() {
    if (timer) return stop();
    if (i === STEPS.length - 1) go(0);
    $("play").textContent = "❚❚ Pause";
    timer = setInterval(() => { if (i >= STEPS.length - 1) stop(); else go(i + 1); }, 2600);
  }
  $("prev").onclick = () => { stop(); go(i - 1); };
  $("next").onclick = () => { stop(); go(i + 1); };
  $("reset").onclick = () => { stop(); go(0); };
  $("play").onclick = play;
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { stop(); go(i + 1); }
    else if (e.key === "ArrowLeft") { stop(); go(i - 1); }
    else if (e.key === " ") { e.preventDefault(); play(); }
  });
  go(0);
})();
</script>
</body>
</html>
